<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>維護中</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            background: linear-gradient(135deg,#f5f9ff 0%,#eef5ff 52%,#fff8f2 100%);
        }
        body::before { content:""; position:fixed; inset:-20%; z-index:-1; pointer-events:none; background:radial-gradient(circle at 18% 18%,rgba(125,211,252,.18),transparent 28%),radial-gradient(circle at 84% 72%,rgba(196,181,253,.18),transparent 30%); animation:softDrift 16s ease-in-out infinite alternate; }
        main { box-shadow:0 24px 65px rgba(76,111,160,.14); border-color:rgba(203,213,225,.72); animation:popIn .35s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
        main > div:first-child { background:linear-gradient(110deg,#4f8edb,#6475d7 60%,#8b78d2); background-size:180% 180%; animation:headerFlow 9s ease infinite; }

        .worker { animation: bob .6s ease-in-out infinite alternate; }
        .dust { opacity:0; fill:#cbd5e1; animation: puff 1.2s ease-out infinite; }
        .dust:nth-of-type(2) { animation-delay:.3s; }
        .dust:nth-of-type(3) { animation-delay:.6s; }
        .dust:nth-of-type(4) { animation-delay:.9s; }
        .sparkle { fill:#fbbf24; opacity:0; animation: twinkle 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
        .sparkle.s2 { animation-delay:.8s; }
        .sparkle.s3 { animation-delay:1.6s; }
        .dots span { animation: blink 1.4s infinite; }
        .dots span:nth-child(2) { animation-delay:.25s; }
        .dots span:nth-child(3) { animation-delay:.5s; }

        @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-2px); } }
        @keyframes puff { 0% { opacity:.7; transform:translate(0,0) scale(.6); } 100% { opacity:0; transform:translate(22px,-20px) scale(1.6); } }
        @keyframes twinkle { 0%,100% { opacity:0; transform:scale(.3); } 50% { opacity:1; transform:scale(1); } }
        @keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }
        @keyframes popIn { from { opacity:0; transform:scale(.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
        @keyframes softDrift { from { transform:translate3d(-12px,-8px,0) scale(1); } to { transform:translate3d(16px,14px,0) scale(1.06); } }
        @keyframes headerFlow { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
        @media (prefers-reduced-motion:reduce) {
            body::before, main, main > div:first-child, .worker, .dust, .sparkle, .dots span { animation:none; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased selection:bg-blue-500 selection:text-white">
    <main class="w-full max-w-lg bg-white border rounded-3xl overflow-hidden">
        <div class="p-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-white tracking-widest">維護中</h1>
        </div>
        <div class="px-6 pt-10 pb-6 text-center">
            <p class="text-lg sm:text-xl font-semibold text-slate-700 tracking-wide">暫停接收投稿<span class="dots text-blue-500"><span>.</span><span>.</span><span>.</span></span></p>

            <svg viewBox="0 0 400 170" class="w-full max-w-sm mx-auto mt-6" role="img" aria-label="有人正在打掃">
                <!-- floor -->
                <line x1="30" y1="148" x2="370" y2="148" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

                <!-- clean sparkles (left, already swept) -->
                <path class="sparkle" d="M90 130 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3z"/>
                <path class="sparkle s2" d="M135 118 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2z"/>
                <path class="sparkle s3" d="M60 116 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2z"/>

                <!-- person -->
                <g class="worker">
                    <!-- legs -->
                    <line x1="200" y1="112" x2="190" y2="148" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
                    <line x1="200" y1="112" x2="212" y2="148" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
                    <!-- body -->
                    <rect x="188" y="78" width="24" height="38" rx="10" fill="#6475d7"/>
                    <!-- head -->
                    <circle cx="200" cy="62" r="15" fill="#fde2c8"/>
                    <!-- cap -->
                    <path d="M184 60 a16 16 0 0 1 32 0 z" fill="#4f8edb"/>
                    <rect x="200" y="58" width="22" height="4" rx="2" fill="#4f8edb"/>
                    <!-- eyes -->
                    <circle cx="204" cy="66" r="1.6" fill="#1e293b"/>
                    <!-- arm to broom -->
                    <line x1="204" y1="90" x2="222" y2="104" stroke="#fde2c8" stroke-width="5" stroke-linecap="round"/>

                    <!-- broom (swings around the hand) -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate"
                            values="-14 222 104;14 222 104;-14 222 104" dur="1.2s" repeatCount="indefinite"
                            calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
                        <line x1="222" y1="104" x2="252" y2="144" stroke="#a16207" stroke-width="4" stroke-linecap="round"/>
                        <path d="M244 140 L264 140 L270 150 L248 150 Z" fill="#eab308"/>
                        <line x1="250" y1="142" x2="252" y2="150" stroke="#a16207" stroke-width="1.2"/>
                        <line x1="257" y1="142" x2="259" y2="150" stroke="#a16207" stroke-width="1.2"/>
                        <line x1="264" y1="142" x2="265" y2="150" stroke="#a16207" stroke-width="1.2"/>
                    </g>
                </g>

                <!-- dust puffs -->
                <circle class="dust" cx="272" cy="144" r="5"/>
                <circle class="dust" cx="272" cy="144" r="4"/>
                <circle class="dust" cx="272" cy="144" r="6"/>
                <circle class="dust" cx="272" cy="144" r="3.5"/>
            </svg>
        </div>
    </main>
</body>
</html>
